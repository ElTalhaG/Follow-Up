services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: followup
      POSTGRES_USER: followup
      POSTGRES_PASSWORD: followup
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U followup -d followup"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - followup-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://followup:followup@postgres:5432/followup
      AUTH_SECRET: local-staging-secret
      GMAIL_MOCK_MODE: "true"
      CORS_ORIGIN: http://localhost:5173
      STRIPE_PAYMENT_LINK_MODE: mock
    ports:
      - "4000:4000"

volumes:
  followup-postgres:
