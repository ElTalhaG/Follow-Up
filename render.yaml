services:
  - type: web
    name: followup-backend
    env: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: RUN_RELEASE_ON_BOOT
        value: "false"

  - type: web
    name: followup-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  - name: followup-postgres
    plan: free
    databaseName: followup
    user: followup
